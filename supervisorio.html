<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisório — Beneficiamento Têxtil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090c11;
    --panel:#121a25;
    --panel-2:#18212f;
    --panel-3:#1f2a3a;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --ink:#eef2f7;
    --ink-soft:#93a3b8;
    --ink-muted:#5c6d82;
    --accent:#2dd4d8;
    --accent-dim:rgba(45,212,216,.14);
    --blue:#3987e5;
    --orange:#d95926;
    --aqua:#199e70;
    --yellow:#c98500;
    --good:#0ca30c;
    --warning:#fab219;
    --serious:#ec835a;
    --critical:#d03b3b;
    --mimic-bg:#e6eaef;
    --mimic-ink:#28313d;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  }
  h1,h2,h3,.display{font-family:'Titillium Web',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono','Consolas',monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:12px 20px; padding-top:calc(12px + env(safe-area-inset-top,0px));
    background:linear-gradient(180deg,#0d131b 0%, #0b1017 100%);
    border-bottom:1px solid var(--line-strong);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .brand{display:flex; flex-direction:column; margin-right:auto;}
  .brand b{font-size:15px; letter-spacing:.06em; text-transform:uppercase;}
  .brand span{font-size:11.5px; color:var(--ink-muted); letter-spacing:.04em;}
  .clock{font-size:13px; color:var(--ink-soft); text-align:right; line-height:1.3;}
  .clock b{color:var(--ink); display:block; font-size:16px;}

  .alarm-chip{
    display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line); font-size:12px; color:var(--ink-soft);
  }
  .alarm-chip .dot{width:8px;height:8px;border-radius:50%;}
  .alarm-chip b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}

  .speed-ctrl{display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:6px 12px;}
  .speed-ctrl label{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
  .speed-ctrl input[type=range]{width:110px; accent-color:var(--accent);}
  .speed-ctrl .val{font-family:'IBM Plex Mono',monospace; font-size:15px; min-width:66px; text-align:right;}

  .btn-run{
    font-family:'Titillium Web',sans-serif; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:10px 20px; border-radius:10px; border:1px solid var(--line-strong);
    cursor:pointer; transition:filter .15s ease;
  }
  .btn-run.run{background:var(--accent); color:#04262a; border-color:var(--accent);}
  .btn-run.stop{background:var(--critical); color:#2a0505; border-color:var(--critical);}
  .btn-run:hover{filter:brightness(1.08);}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px; margin:0 auto; padding:22px 20px 0;}
  .intro{color:var(--ink-soft); font-size:14px; line-height:1.6; max-width:74ch; margin:0 0 22px;}
  .intro b{color:var(--ink);}

  .section-title{
    display:flex; align-items:center; gap:10px; margin:34px 0 14px;
    font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-muted);
  }
  .section-title::after{content:""; flex:1; height:1px; background:var(--line);}

  /* ---------- navegação entre etapas ---------- */
  .stage-nav{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin:0 0 22px;}
  .nav-tab{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-soft);
    font:inherit; text-align:left; cursor:pointer; min-width:0; transition:border-color .15s ease, background .15s ease;
  }
  .nav-tab:hover{border-color:var(--line-strong);}
  .nav-tab.active{background:var(--accent-dim); border-color:rgba(45,212,216,.5); color:var(--ink);}
  .nav-tab .n{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-muted);}
  .nav-tab.active .n{color:var(--accent);}
  .nav-tab .t{font-family:'Titillium Web',sans-serif; font-weight:700; font-size:14px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-tab .st{width:9px; height:9px; border-radius:50%; flex:none; background:var(--ink-muted);}
  .nav-tab .st.on{background:var(--accent);}
  .nav-tab .st.alarm{background:var(--critical); animation:pulseAlarm 1.4s infinite;}
  .nav-tab .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:10px; background:rgba(208,59,59,.2); color:#ff9b9b;}
  .nav-tab .cnt:empty{display:none;}

  .stage{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .stage[hidden]{display:none;}
  .stage-head{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .stage-num{font-family:'IBM Plex Mono',monospace; color:var(--ink-muted); font-size:13px;}
  .stage-name{font-family:'Titillium Web',sans-serif; font-weight:700; font-size:22px; display:flex; flex-direction:column; flex:1; margin:0;}
  .stage-name small{font-family:'IBM Plex Mono',monospace; font-weight:400; color:var(--ink-muted); font-size:11px; letter-spacing:.04em; margin-top:2px;}
  .stage-desc{color:var(--ink-soft); font-size:13.5px; line-height:1.6; max-width:80ch; margin:0 0 16px;}
  .stage-summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px;}

  .pager{display:flex; justify-content:space-between; gap:12px; margin-top:22px;}
  .pager-btn{
    display:flex; flex-direction:column; gap:2px; padding:12px 16px; border-radius:10px; min-width:0;
    background:var(--panel-2); border:1px solid var(--line-strong); color:var(--ink); font:inherit; cursor:pointer; text-align:left;
  }
  .pager-btn:hover{border-color:var(--accent);}
  .pager-btn small{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
  .pager-btn b{font-family:'Titillium Web',sans-serif; font-size:15px;}
  .pager-btn.next{margin-left:auto; text-align:right;}
  .pager-btn.home{margin:0 auto; text-align:center; align-items:center;}
  .pager-btn.home + .pager-btn.next{margin-left:0;}
  .home-btn{
    font-family:'Titillium Web',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase;
    padding:7px 14px; border-radius:8px; cursor:pointer; white-space:nowrap;
    background:var(--panel-3); color:var(--ink); border:1px solid var(--line-strong);
  }
  .home-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- visão geral ---------- */
  .ov-frame{position:relative; aspect-ratio:1600/900; border-radius:10px; overflow:hidden; border:1px solid var(--line-strong); margin-bottom:18px;}
  .ov-frame img{display:block; width:100%; height:100%; object-fit:cover;}
  .ov-spot{
    position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; gap:8px;
    padding:5px 5px 5px 12px; border-radius:24px; white-space:nowrap;
    background:rgba(9,12,17,.88); border:1px solid var(--line-strong); box-shadow:0 4px 14px rgba(0,0,0,.45);
  }
  .ov-spot.stopped{border-color:rgba(208,59,59,.7);}
  .ov-spot .go{display:flex; align-items:center; gap:7px; background:none; border:none; padding:0; color:var(--ink); font:inherit; cursor:pointer;}
  .ov-spot .go .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent);}
  .ov-spot .go b{font-family:'Titillium Web',sans-serif; font-size:13px;}
  .ov-spot .go:hover b{text-decoration:underline;}
  .st-dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--ink-muted);}
  .st-dot.on{background:var(--accent);}
  .st-dot.alarm{background:var(--critical); animation:pulseAlarm 1.4s infinite;}
  .pw-btn{
    width:28px; height:28px; border-radius:50%; flex:none; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1; font-family:inherit;
    background:#0b0f14; border:1.5px solid var(--critical); color:var(--critical);
    box-shadow:0 0 8px 1px rgba(208,59,59,.45);
  }
  .pw-btn.off{border-color:var(--good); color:var(--good); box-shadow:none;}
  .pw-btn:disabled{opacity:.45; cursor:not-allowed;}

  .ov-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;}
  .ov-card{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px;}
  .ov-card.stopped{background:rgba(208,59,59,.12); border-color:rgba(208,59,59,.5);}
  .ov-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .ov-card-head .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-muted);}
  .ov-card-head b{display:block; font-family:'Titillium Web',sans-serif; font-size:16px;}
  .ov-rows{display:grid; grid-template-columns:1fr auto; gap:4px 10px; font-size:12px; color:var(--ink-soft);}
  .ov-rows b{font-family:'IBM Plex Mono',monospace; color:var(--ink); text-align:right;}
  .ov-actions{display:flex; gap:8px; margin-top:auto;}
  .ov-actions button{flex:1; font-family:'Titillium Web',sans-serif; font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; padding:8px 10px; border-radius:8px; cursor:pointer; border:1px solid var(--line-strong); background:var(--panel-3); color:var(--ink);}
  .ov-actions .stage-power{background:rgba(208,59,59,.18); border-color:rgba(208,59,59,.6); color:#ff9b9b;}
  .ov-actions .stage-power.off{background:rgba(12,163,12,.16); border-color:rgba(12,163,12,.55); color:#7bdd7b;}
  .ov-actions button:disabled{opacity:.45; cursor:not-allowed;}
  .state-chip.EVENTO{background:rgba(45,212,216,.12); color:var(--accent); border:1px solid rgba(45,212,216,.35);}
  .stage-pill{font-size:11px; font-weight:600; letter-spacing:.05em; padding:4px 10px; border-radius:20px; text-transform:uppercase; white-space:nowrap;}
  .stage-pill.on{background:var(--accent-dim); color:var(--accent); border:1px solid rgba(45,212,216,.4);}
  .stage-pill.off{background:rgba(255,255,255,.05); color:var(--ink-muted); border:1px solid var(--line);}
  .stage-pill.alarm{background:rgba(208,59,59,.16); color:#ff9b9b; border:1px solid rgba(208,59,59,.5); animation:pulseAlarm 1.4s infinite;}
  @keyframes pulseAlarm{0%,100%{opacity:1;}50%{opacity:.55;}}
  .stage-kpi{display:flex; flex-direction:column; align-items:flex-end; min-width:78px;}
  .stage-kpi b{font-family:'IBM Plex Mono',monospace; font-size:18px;}
  .stage-kpi small{color:var(--ink-muted); font-size:10.5px;}
  .stage-body-inner{padding:18px 18px 20px;}

  /* ---------- mimic diagram ---------- */
  .mimic-wrap{margin-bottom:16px;}
  .mimic-frame{
    position:relative; width:100%; background:var(--mimic-bg); border-radius:10px;
    border:1px solid var(--line-strong); overflow:hidden;
  }
  .mimic-frame img{display:block; width:100%; height:100%; object-fit:contain;}
  .flow-strip{position:relative; height:14px; margin-top:8px; background:var(--panel-2); border-radius:7px; overflow:hidden; border:1px solid var(--line);}
  .flow-track{position:absolute; inset:0; background:repeating-linear-gradient(90deg, transparent 0 10px, var(--line-strong) 10px 11px);}
  .flow-marker{position:absolute; top:-3px; left:-6%; width:20px; height:20px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #bffcff, var(--accent) 60%, transparent 75%);
    box-shadow:0 0 10px 2px var(--accent); animation:flow 3.4s linear infinite;}
  .flow-marker.paused{animation-play-state:paused; opacity:.25;}
  @keyframes flow{from{left:-6%;} to{left:104%;}}
  .station-legend{list-style:none; display:flex; flex-wrap:wrap; gap:6px 16px; padding:10px 2px 0; margin:0; font-size:12px; color:var(--ink-soft);}
  .station-legend li{display:flex; align-items:center; gap:6px;}
  .station-legend b{font-family:'IBM Plex Mono',monospace; color:var(--accent); font-size:11px;}

  /* ---------- tag readouts ---------- */
  .subhead{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin:4px 0 8px;}
  .tag-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:10px; margin-bottom:16px;}
  .tag{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; position:relative;}
  .tag .id{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-muted); letter-spacing:.03em;}
  .tag .label{font-size:12px; color:var(--ink-soft); margin:2px 0 6px; line-height:1.25; min-height:30px;}
  .tag .pv-row{display:flex; align-items:baseline; gap:5px;}
  .tag .pv{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .tag .unit{font-size:11px; color:var(--ink-muted);}
  .tag .sp{font-size:10.5px; color:var(--ink-muted); margin-top:3px; font-family:'IBM Plex Mono',monospace;}
  .tag .note{font-size:10.5px; color:var(--warning); margin-top:4px; font-weight:600; display:none;}
  .tag.idle .note{display:block;}
  .tag .bar{height:4px; border-radius:2px; background:rgba(255,255,255,.08); margin-top:8px; overflow:hidden;}
  .tag .bar i{display:block; height:100%; background:var(--accent);}
  .tag.state-ok .pv{color:var(--ink);}
  .tag.state-ok .bar i{background:var(--good);}
  .tag.state-warn{border-color:rgba(250,178,25,.5);}
  .tag.state-warn .pv{color:var(--warning);}
  .tag.state-warn .bar i{background:var(--warning);}
  .tag.state-alarm{border-color:rgba(208,59,59,.6); background:rgba(208,59,59,.08);}
  .tag.state-alarm .pv{color:#ff8a8a;}
  .tag.state-alarm .bar i{background:var(--critical);}

  /* ---------- motors ---------- */
  .motor-badge{
    position:absolute; transform:translate(-50%,-50%); width:27px; height:27px; border-radius:8px;
    background:#0b0f14; border:1.5px solid var(--ink-muted); color:var(--ink-muted);
    display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1; padding:0;
    cursor:pointer; box-shadow:0 0 0 3px rgba(255,255,255,.35); transition:border-color .15s ease, color .15s ease;
    font-family:inherit;
  }
  .motor-badge.on{border-color:var(--critical); color:var(--critical); box-shadow:0 0 0 3px rgba(255,255,255,.35), 0 0 9px 1px rgba(208,59,59,.55);}
  .motor-badge.off{border-color:var(--good); color:var(--good);}
  .motor-badge:disabled{opacity:.45; cursor:not-allowed;}

  .motor-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; margin-bottom:16px;}
  .motor{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .motor-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .motor .id{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-muted); letter-spacing:.03em;}
  .motor .label{font-size:12px; color:var(--ink-soft); margin:0 0 8px; line-height:1.25; min-height:30px;}
  .motor .freq-row{display:flex; align-items:baseline; gap:5px;}
  .motor .freq{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .motor .unit{font-size:11px; color:var(--ink-muted);}
  .motor .state-text{font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; margin-top:3px; font-weight:600;}
  .motor.state-on .freq{color:var(--ink);}
  .motor.state-on .state-text{color:var(--critical);}
  .motor.state-off{background:rgba(208,59,59,.22); border-color:rgba(208,59,59,.6);}
  .motor.state-off .freq{color:#ffb3b3;}
  .motor.state-off .state-text{color:var(--good);}
  .motor.state-transition .state-text{color:var(--warning);}

  .switch{
    position:relative; width:38px; height:20px; border-radius:20px; border:none; cursor:pointer;
    background:var(--good); transition:background .18s ease; padding:0; flex:none;
  }
  .switch i{
    position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
    background:#fff; transition:transform .18s ease; display:block;
  }
  .switch.on{background:var(--critical);}
  .switch.on i{transform:translateX(18px);}
  .switch:disabled{opacity:.4; cursor:not-allowed;}

  /* ---------- trend ---------- */
  .trend-panel{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .trend-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:8px;}
  .trend-head h3{margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .legend{display:flex; gap:12px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; user-select:none;}
  .legend-item .sw{width:10px; height:10px; border-radius:2px;}
  .legend-item.off{opacity:.35;}
  .legend-item b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}
  canvas.chart{width:100%; height:200px; display:block; cursor:crosshair;}
  .tooltip{position:absolute; pointer-events:none; background:#0b0f14; border:1px solid var(--line-strong);
    border-radius:8px; padding:8px 10px; font-size:11.5px; color:var(--ink-soft); display:none; z-index:5; white-space:nowrap;}
  .tooltip b{color:var(--ink);}
  .chart-wrap{position:relative;}

  /* ---------- alarms ---------- */
  .alarm-panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  table.alarms{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.alarms th{text-align:left; padding:10px 14px; color:var(--ink-muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); background:var(--panel-2);}
  table.alarms td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.alarms tr:last-child td{border-bottom:none;}
  .sev{display:inline-flex; align-items:center; gap:6px;}
  .sev .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .state-chip{font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:600; letter-spacing:.03em;}
  .state-chip.ATIVO{background:rgba(208,59,59,.15); color:#ff9b9b; border:1px solid rgba(208,59,59,.4);}
  .state-chip.RECONHECIDO{background:rgba(250,178,25,.15); color:var(--warning); border:1px solid rgba(250,178,25,.4);}
  .state-chip.NORMALIZADO{background:rgba(12,163,12,.15); color:#7bdd7b; border:1px solid rgba(12,163,12,.4);}
  .ack-btn{font-family:'IBM Plex Sans',sans-serif; font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--panel-3); color:var(--ink); cursor:pointer;}
  .ack-btn:hover{filter:brightness(1.2);}
  .empty-row td{text-align:center; color:var(--ink-muted); padding:20px;}
  .alarms-scroll{max-height:340px; overflow-y:auto;}

  /* ---------- footer stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:14px 0 30px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .stat .k{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .stat .v{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .stat .v small{font-size:12px; color:var(--ink-muted); font-weight:400;}
  .stat .sub{font-size:11px; color:var(--ink-muted); margin-top:4px;}

  @media (max-width:640px){
    .topbar{padding:10px 14px;}
    .brand b{font-size:13px;}
    .clock{display:none;}
    .speed-ctrl input[type=range]{width:80px;}
    .stage-nav{grid-template-columns:repeat(6,auto); overflow-x:auto;}
    .ov-spot{padding:3px;}
    .ov-spot .go b{display:none;}
    .pw-btn{width:24px; height:24px; font-size:11px;}
    .nav-tab .t{display:none;}

// Liga/desliga uma etapa inteira pela visão geral.
function toggleStagePower(id){
  if(!running) return;
  const stage = STAGES.find(s => s.id === id);
  stage._stopped = !stage._stopped;
  if(stage._stopped){
    stage.motors.forEach(m => { if(m.on){ m.on = false; m._stageTripped = true; } });
  } else {
    stage.motors.forEach(m => { if(m._stageTripped){ m.on = true; m._stageTripped = false; } });
  }
  alarms.unshift({id:alarmSeq++, t:Date.now(), stageId:stage.id, stageName:stage.name, tagId:stage.code,
    message: stage._stopped ? 'Etapa desligada pelo operador' : 'Etapa religada pelo operador',
    severity:'evento', state:'EVENTO'});
  if(alarms.length>200) alarms.pop();
  renderMotors(stage);
  renderStageHead(stage);
  renderOverview();
  renderAlarms();
}
window.toggleStagePower = toggleStagePower;

function renderOverview(){
  let stagesOn = 0, motorsOn = 0, motorsTotal = 0, pendingTotal = 0, unackedTotal = 0;
  STAGES.forEach(s => {
    const anyAlarm = s.tags.some(t => t._alarmOpen);
    const on = s.motors.filter(m => m.freq >= 0.5).length;
    const stopped = !running || s._stopped || on === 0;
    const pending = alarms.filter(a => a.stageId === s.id && a.state !== 'NORMALIZADO' && a.state !== 'EVENTO');
    motorsOn += on; motorsTotal += s.motors.length;
    pendingTotal += pending.length;
    unackedTotal += pending.filter(a => a.state === 'ATIVO').length;
    if(!stopped) stagesOn++;

    const dot = document.getElementById('ovdot-'+s.id);
    dot.classList.remove('on','alarm');
    const pill = document.getElementById('ovpill-'+s.id);
    pill.classList.remove('on','off','alarm');
    if(stopped){ pill.textContent = s._stopped ? 'Desligada' : 'Parado'; pill.classList.add('off'); }
    else if(anyAlarm){ pill.textContent = 'Alarme'; pill.classList.add('alarm'); dot.classList.add('alarm'); }
    else { pill.textContent = 'Rodando'; pill.classList.add('on'); dot.classList.add('on'); }

    const h = s.tags[s.headline];
    document.getElementById('ovkpi-'+s.id).textContent = `${fmt(h.pv, h.dec)} ${h.unit}`;
    document.getElementById('ovmot-'+s.id).textContent = `${on} / ${s.motors.length}`;
    document.getElementById('ovalm-'+s.id).textContent = pending.length;

    document.getElementById('ovspot-'+s.id).classList.toggle('stopped', !!s._stopped);
    document.getElementById('ovcard-'+s.id).classList.toggle('stopped', !!s._stopped);
    const pw = document.getElementById('ovpw-'+s.id);
    pw.classList.toggle('off', !!s._stopped);
    pw.disabled = !running;
    const btn = document.getElementById('ovbtn-'+s.id);
    btn.classList.toggle('off', !!s._stopped);
    btn.textContent = s._stopped ? 'Ligar' : 'Desligar';
    btn.disabled = !running;
  });

  document.getElementById('ovSumStages').innerHTML = `${stagesOn} <small>/ ${STAGES.length}</small>`;
  document.getElementById('ovSumMotors').innerHTML = `${motorsOn} <small>/ ${motorsTotal}</small>`;
  document.getElementById('ovSumAlarms').textContent = pendingTotal;
  document.getElementById('ovSumAlarmsSub').textContent = pendingTotal ? `${unackedTotal} sem reconhecimento` : 'sem pendências';
  document.getElementById('ovSumSpeed').innerHTML = `${running ? globalSpeed : 0} <small>m/min</small>`;

  const pill = document.getElementById('pill-geral');
  pill.classList.remove('on','off','alarm');
  const anyAlarm = STAGES.some(s => s.tags.some(t => t._alarmOpen));
  if(!running || stagesOn === 0){ pill.textContent = 'Parado'; pill.classList.add('off'); }
  else if(anyAlarm){ pill.textContent = 'Alarme'; pill.classList.add('alarm'); }
  else { pill.textContent = stagesOn < STAGES.length ? 'Parcial' : 'Rodando'; pill.classList.add('on'); }
}

          <div class="stat"><div class="k">Alarmes ativos</div><div class="v" id="sumAlm-${stage.id}">0</div><div class="sub" id="sumAlmSub-${stage.id}">sem pendências</div></div>
          <div class="stat"><div class="k">Instrumentos na faixa</div><div class="v" id="sumTag-${stage.id}">–</div><div class="sub">dentro de lo–hi</div></div>

        </div>
        <div class="mimic-wrap">
          <div class="mimic-frame" style="aspect-ratio:${stage.ratio}">
            <img src="${stage.img}" alt="Diagrama esquemático — ${stage.name}" loading="lazy">
            ${motorBadges}
          </div>
          <div class="flow-strip"><div class="flow-track"></div><div class="flow-marker" id="flow-${stage.id}"></div></div>
          <ol class="station-legend">${legend}</ol>

        <div class="trend-panel">

// Cada etapa é uma página própria, endereçada por #slug (ex.: supervisorio.html#purga).
// Sem #slug (logo após o login) abre a visão geral.
const OVERVIEW_PAGE = {id:'geral', slug:'geral', name:'Visão geral'};

function showStage(id, fromHash){
  const page = id === 'geral' ? OVERVIEW_PAGE : (STAGES.find(s => s.id === id) || OVERVIEW_PAGE);
  currentStageId = page.id;
  [OVERVIEW_PAGE, ...STAGES].forEach(s => {
    document.getElementById('stage-'+s.id).hidden = s.id !== page.id;
    document.getElementById('nav-'+s.id).classList.toggle('active', s.id === page.id);
  });
  document.title = `${page.name} — Supervisório Têxtil`;
  if(!fromHash && location.hash !== '#'+page.slug) history.pushState(null, '', '#'+page.slug);
  window.scrollTo(0, 0);
  if(page !== OVERVIEW_PAGE) drawChart(page);
}

function stageFromHash(){
  const slug = location.hash.replace('#','');
  return (STAGES.find(s => s.slug === slug) || OVERVIEW_PAGE).id;
}
window.addEventListener('popstate', () => showStage(stageFromHash(), true));
window.addEventListener('hashchange', () => showStage(stageFromHash(), true));

function toggleSeries(stageId, idx, el){
  const stage = STAGES.find(s=>s.id===stageId);
  stage.tags[idx]._visible = !stage.tags[idx]._visible;
  el.classList.toggle('off', !stage.tags[idx]._visible);
}

function pushAlarm(stage, tag, severity){
  alarms.unshift({id:alarmSeq++, t:Date.now(), stageId:stage.id, stageName:stage.name, tagId:tag.id,
    message:`${tag.label} fora da faixa de operação`, severity, state:'ATIVO'});
  if(alarms.length>200) alarms.pop();
}

function normalizeAlarm(stage, tag){
  const open = alarms.find(a => a.stageId===stage.id && a.tagId===tag.id && a.state!=='NORMALIZADO');
  if(open) open.state='NORMALIZADO';
}

function ackAlarm(id){
  const a = alarms.find(a=>a.id===id);
  if(a && a.state==='ATIVO') a.state='RECONHECIDO';
  renderAlarms();
}
window.ackAlarm = ackAlarm;
window.showStage = showStage;
window.toggleSeries = toggleSeries;

// Intertravamento: desenroladores/enroladores (master:true) comandam a etapa inteira.
function isInterlocked(stage){
  return stage.motors.some(m => m.master && !m.on);
}

function toggleMotor(stageId, idx){
  if(!running) return;
  const stage = STAGES.find(s => s.id === stageId);
  const motor = stage.motors[idx];
  if(stage._stopped) return;
  if(!motor.master && isInterlocked(stage)) return;
  motor.on = !motor.on;

  if(motor.master && !motor.on){
    // Desligou um desenrolador/enrolador: desarma todos os outros motores da etapa.
    stage.motors.forEach(m => {
      if(m !== motor && m.on){ m.on = false; m._tripped = true; }
    });
    alarms.unshift({id:alarmSeq++, t:Date.now(), stageId:stage.id, stageName:stage.name, tagId:motor.id,
      message:`Intertravamento: ${motor.station.toLowerCase()} desligado — etapa parada`, severity:'serious',
      state:'ATIVO', interlock:true});
    if(alarms.length>200) alarms.pop();
  } else if(motor.master && motor.on){
    // Religou: os motores desarmados pelo intertravamento voltam a partir.
    motor._tripped = false;
    stage.motors.forEach(m => { if(m._tripped){ m.on = true; m._tripped = false; } });
    const open = alarms.find(a => a.interlock && a.stageId===stage.id && a.state!=='NORMALIZADO');
    if(open) open.state = 'NORMALIZADO';
  }
  renderMotors(stage);
  renderAlarms();
}
window.toggleMotor = toggleMotor;

function stepMotor(motor){
  const target = (running && motor.on) ? motor.nominalHz + (Math.random()-0.5)*0.6 : 0;
  motor.freq += (target - motor.freq) * 0.3;
  if(motor.freq < 0.05) motor.freq = 0;
}

function renderMotors(stage){
  const interlocked = isInterlocked(stage);
  stage.motors.forEach((m,i) => {
    const running_effective = running && m.on;
    const started = m.freq >= m.nominalHz*0.85;
    const locked = !running || stage._stopped || (interlocked && !m.master);
    let state, cls;
    if(running_effective && started){ state='Ligado'; cls='state-on'; }
    else if(running_effective){ state='Partida'; cls='state-transition'; }
    else if(m.freq > 0.5){ state='Parando'; cls='state-transition'; }
    else if(m._tripped){ state='Intertravado'; cls='state-off'; }
    else { state='Desligado'; cls='state-off'; }

    document.getElementById(`freq-${stage.id}-${i}`).textContent = m.freq.toFixed(1);
    document.getElementById(`mstate-${stage.id}-${i}`).textContent = state;
    const chip = document.getElementById(`motor-${stage.id}-${i}`);
    chip.classList.remove('state-on','state-off','state-transition');
    chip.classList.add(cls);

    const sw = document.getElementById(`switch-${stage.id}-${i}`);
    sw.classList.toggle('on', m.on);
    sw.disabled = locked;
    sw.setAttribute('aria-pressed', String(m.on));

    const badge = document.getElementById(`mbadge-${stage.id}-${i}`);
    badge.classList.toggle('on', m.on && m.freq > 0.5);
    badge.classList.toggle('off', !(m.on && m.freq > 0.5));
    badge.disabled = locked;
  });
}

function stepTag(tag){
  const range = tag.hi - tag.lo;
  const idleActive = tag._idleActive && tag.idle !== undefined;
  if(idleActive){
    const noise = (Math.random()-0.5) * range * 0.04;
    tag.pv += noise + (tag.idle - tag.pv) * 0.12;
  } else if(!running){
    tag.pv += (tag.sp - tag.pv) * 0.08;
  } else {
    // Operação normal: oscilação em torno do SP, sempre dentro da faixa lo–hi.
    // halfBand = menor distância do SP até um dos limites (ou 10% da faixa se o SP estiver fora dela).
    const halfBand = Math.max(Math.min(tag.sp - tag.lo, tag.hi - tag.sp), range*0.1);
    const limit = halfBand * 0.8;
    let dev = tag.pv - tag.sp;
    if(Math.abs(dev) > limit){
      // Voltando de uma condição anormal (motor religado): retorna ao SP sem saltos.
      dev *= 0.85;
    } else {
      dev = dev*0.85 + (Math.random()-0.5) * halfBand * 0.24;
      dev = Math.max(-limit, Math.min(limit, dev));
    }
    tag.pv = tag.sp + dev;
  }
  let hardLo = tag.aLo - range*0.35, hardHi = tag.aHi + range*0.35;
  if(idleActive){
    hardLo = Math.min(hardLo, tag.idle - range*0.15);
    hardHi = Math.max(hardHi, tag.idle + range*0.15);
  }
  tag.pv = Math.min(hardHi, Math.max(hardLo, tag.pv));
  tag.history.push(tag.pv);
  if(tag.history.length > 60) tag.history.shift();
}

function applyMotorCoupling(stage){
  stage.tags.forEach(t => { t._idleActive = false; });
  stage.motors.forEach(m => {
    if(!m.drives) return;
    const stopped = !(running && m.on);
    if(!stopped) return;
    m.drives.forEach(tagId => {
      const t = stage.tags.find(tg => tg.id === tagId);
      if(t) t._idleActive = true;
    });
  });
}

function evalAlarm(stage, tag){
  const range = tag.hi - tag.lo;
  const bandOut = tag.pv < tag.aLo || tag.pv > tag.aHi;
  const deepOut = tag.pv < tag.aLo - range*0.2 || tag.pv > tag.aHi + range*0.2;
  if(bandOut && !tag._alarmOpen){
    tag._alarmOpen = true;
    pushAlarm(stage, tag, deepOut ? 'critical' : 'serious');
  } else if(!bandOut && tag._alarmOpen){
    tag._alarmOpen = false;
    normalizeAlarm(stage, tag);
  }
}

function tagState(tag){
  if(tag.pv < tag.aLo || tag.pv > tag.aHi) return 'alarm';
  if(tag.pv < tag.lo || tag.pv > tag.hi) return 'warn';
  return 'ok';
}

function renderTags(stage){
  stage.tags.forEach((t,i) => {
    document.getElementById(`pv-${stage.id}-${i}`).textContent = fmt(t.pv, t.dec);
    const pct = Math.max(0, Math.min(100, ((t.pv - t.aLo) / (t.aHi - t.aLo)) * 100));
    document.getElementById(`bar-${stage.id}-${i}`).style.width = pct+'%';
    const chip = document.getElementById(`tag-${stage.id}-${i}`);
    chip.classList.remove('state-ok','state-warn','state-alarm');
    chip.classList.add('state-'+tagState(t));
    chip.classList.toggle('idle', !!t._idleActive);
  });
}

function renderStageHead(stage){
  const anyAlarm = stage.tags.some(t => t._alarmOpen);
  const allMotorsOff = stage.motors.every(m => m.freq < 0.5);
  const pill = document.getElementById('pill-'+stage.id);
  pill.classList.remove('on','off','alarm');
  const navSt = document.getElementById('navst-'+stage.id);
  navSt.classList.remove('on','alarm');
  if(stage._stopped){ pill.textContent='Desligada'; pill.classList.add('off'); }
  else if(!running || allMotorsOff){ pill.textContent='Parado'; pill.classList.add('off'); }
  else if(anyAlarm){ pill.textContent='Alarme'; pill.classList.add('alarm'); navSt.classList.add('alarm'); }
  else { pill.textContent='Rodando'; pill.classList.add('on'); navSt.classList.add('on'); }

  const h = stage.tags[stage.headline];
  document.getElementById('kpi-'+stage.id).textContent = fmt(h.pv, h.dec);
  document.getElementById('flow-'+stage.id).classList.toggle('paused', !running);

  const motorsOn = stage.motors.filter(m => m.freq >= 0.5).length;
  document.getElementById('sumMot-'+stage.id).innerHTML = `${motorsOn} <small>/ ${stage.motors.length}</small>`;
  const tagsOk = stage.tags.filter(t => tagState(t) === 'ok').length;
  document.getElementById('sumTag-'+stage.id).innerHTML = `${tagsOk} <small>/ ${stage.tags.length}</small>`;
  const ilk = document.getElementById('sumIlk-'+stage.id);
  if(stage._stopped){ ilk.textContent = 'Etapa desligada'; ilk.style.color = '#ff9b9b'; }
  else if(!stage.motors.some(m => m.master)){ ilk.textContent = '—'; ilk.style.color = 'var(--ink-muted)'; }
  else if(isInterlocked(stage)){ ilk.textContent = 'Atuado · etapa parada'; ilk.style.color = '#ff9b9b'; }
  else { ilk.textContent = 'Normal'; ilk.style.color = 'var(--ink)'; }
}

function renderAlarms(){
  const openCount = {warning:0, serious:0, critical:0};
  STAGES.forEach(s => s.tags.forEach(t => {
    if(t._alarmOpen){
      const range = t.hi - t.lo;
      const deep = t.pv < t.aLo - range*0.2 || t.pv > t.aHi + range*0.2;
      openCount[deep?'critical':'serious']++;
    }
  }));
  document.getElementById('cnt-warn').textContent = openCount.serious;
  document.getElementById('cnt-crit').textContent = openCount.critical;

  STAGES.forEach(stage => {
    const list = alarms.filter(a => a.stageId === stage.id);
    const pending = list.filter(a => a.state !== 'NORMALIZADO' && a.state !== 'EVENTO');
    const unacked = pending.filter(a => a.state === 'ATIVO').length;
    document.getElementById('navcnt-'+stage.id).textContent = pending.length || '';
    document.getElementById('sumAlm-'+stage.id).textContent = pending.length;
    document.getElementById('sumAlmSub-'+stage.id).textContent =
      pending.length ? `${unacked} sem reconhecimento` : 'sem pendências';
    renderAlarmRows('alarmBody-'+stage.id, list, false);
  });
  renderAlarmRows('alarmBody-geral', alarms, true);
}

function renderAlarmRows(tbodyId, list, withStage){
  const tbody = document.getElementById(tbodyId);
  const cols = withStage ? 7 : 6;
  if(list.length===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="${cols}">Nenhum evento registrado</td></tr>`;
    return;
  }
  tbody.innerHTML = list.slice(0,30).map(a => {
    const d = new Date(a.t);
    const hh = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    const ackBtn = a.state==='ATIVO' ? `<button class="ack-btn" onclick="ackAlarm(${a.id})">Reconhecer</button>` : '';
    return `<tr>
      <td class="mono">${hh}</td>
      <td><span class="sev"><span class="dot" style="background:${sevColor(a.severity)}"></span>${a.severity}</span></td>
      <td class="mono">${a.tagId}</td>
      ${withStage ? `<td>${a.stageName}</td>` : ''}
      <td>${a.message}</td>
      <td><span class="state-chip ${a.state}">${a.state}</span></td>
      <td>${ackBtn}</td>
    </tr>`;
  }).join('');
}

function drawChart(stage){
  const canvas = document.getElementById('chart-'+stage.id);
  if(!canvas || stage.id !== currentStageId) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const padL=6, padR=6, padT=10, padB=8;
  const plotW = W-padL-padR, plotH = H-padT-padB;

  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = padT + plotH*i/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
  }

  stage.tags.forEach((t,i) => {
    if(!t._visible) return;
    const min = t.aLo - (t.hi-t.lo)*0.1, max = t.aHi + (t.hi-t.lo)*0.1;
    ctx.strokeStyle = CAT[i%4];
    ctx.lineWidth = 2;
    ctx.beginPath();
    t.history.forEach((v,idx) => {
      const x = padL + plotW * idx/(t.history.length-1);
      const y = padT + plotH * (1 - (v-min)/(max-min));
      idx===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.stroke();
    const lastX = padL+plotW, lastY = padT + plotH*(1-(t.pv-min)/(max-min));
    ctx.fillStyle = CAT[i%4];
    ctx.beginPath(); ctx.arc(lastX-2, lastY, 3, 0, Math.PI*2); ctx.fill();
  });
}

function showTooltip(stage, canvas, tooltip, e){
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const idx = Math.round((x/rect.width) * (60-1));
  const visibleTags = stage.tags.filter(t=>t._visible);
  if(visibleTags.length===0){ tooltip.style.display='none'; return; }
  tooltip.innerHTML = visibleTags.map((t,i) =>
    `<span style="color:${CAT[stage.tags.indexOf(t)%4]}">●</span> ${t.label}: <b>${fmt(t.history[idx]??t.pv, t.dec)} ${t.unit}</b>`
  ).join('<br>');
  tooltip.style.display = 'block';
  let left = x+14;
  if(left > rect.width-160) left = x-170;
  tooltip.style.left = left+'px';
  tooltip.style.top = '4px';
}

function updateClock(){
  const d = new Date();
  document.getElementById('clockTime').textContent = d.toLocaleTimeString('pt-BR');
  document.getElementById('clockDate').textContent = d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
}

function tick(){
  STAGES.forEach(stage => {
    stage.tags.forEach(t => { if(t.linkSpeed) t.sp = globalSpeed; });
    applyMotorCoupling(stage);
    stage.tags.forEach(t => {
      stepTag(t);
      // Etapa desligada pelo operador: alarmes de processo ficam inibidos.
      if(stage._stopped){
        if(t._alarmOpen){ t._alarmOpen = false; normalizeAlarm(stage, t); }
      } else {
        evalAlarm(stage, t);
      }
    });
    stage.motors.forEach(stepMotor);
    renderTags(stage);
    renderMotors(stage);
    renderStageHead(stage);
    drawChart(stage);
  });
  renderAlarms();
  renderOverview();

  const dt = 1.5;
  // Consumo proporcional às etapas ligadas; a linha é contínua, então só produz com todas ligadas.
  const activeFrac = STAGES.filter(s => !s._stopped).length / STAGES.length;
  if(running && activeFrac > 0){
    if(activeFrac === 1) totals.meters += globalSpeed * (dt/60);
    const waterRate = (8 + (globalSpeed/45)*7) * activeFrac;
    const steamRate = (280 + (globalSpeed/45)*340) * activeFrac;
    const powerKw = (140 + (globalSpeed/45)*110) * activeFrac;
    totals.water += waterRate*(dt/3600);
    totals.steam += steamRate*(dt/3600);
    totals.energyKwh += powerKw*(dt/3600);
    document.getElementById('stWater').innerHTML = waterRate.toFixed(1)+' <small>m³/h</small>';
    document.getElementById('stSteam').innerHTML = Math.round(steamRate)+' <small>kg/h</small>';
    document.getElementById('stPower').innerHTML = Math.round(powerKw)+' <small>kW</small>';
    const anyAlarm = STAGES.some(s=>s.tags.some(t=>t._alarmOpen));
    const eff = activeFrac < 1 ? 0 : (anyAlarm ? 88+Math.random()*4 : 94+Math.random()*4);
    document.getElementById('stEff').innerHTML = eff.toFixed(1)+' <small>%</small>';
  } else {
    document.getElementById('stWater').innerHTML = '0.0 <small>m³/h</small>';
    document.getElementById('stSteam').innerHTML = '0 <small>kg/h</small>';
    document.getElementById('stPower').innerHTML = '0 <small>kW</small>';
    document.getElementById('stEff').innerHTML = '0.0 <small>%</small>';
  }
  document.getElementById('stTotal').innerHTML = Math.round(totals.meters).toLocaleString('pt-BR')+' <small>m</small>';
  document.getElementById('stWaterTot').textContent = totals.water.toFixed(1)+' m³ acumulado';
  document.getElementById('stSteamTot').textContent = Math.round(totals.steam).toLocaleString('pt-BR')+' kg acumulado';
  document.getElementById('stPowerTot').textContent = Math.round(totals.energyKwh).toLocaleString('pt-BR')+' kWh acumulado';
}

document.getElementById('btnRun').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? 'Rodando' : 'Parado';
  this.classList.toggle('run', running);
  this.classList.toggle('stop', !running);
});

document.getElementById('speedRange').addEventListener('input', function(){
