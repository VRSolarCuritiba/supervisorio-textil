<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supervisório — Beneficiamento Têxtil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090c11;
    --panel:#121a25;
    --panel-2:#18212f;
    --panel-3:#1f2a3a;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --ink:#eef2f7;
    --ink-soft:#93a3b8;
    --ink-muted:#5c6d82;
    --accent:#2dd4d8;
    --accent-dim:rgba(45,212,216,.14);
    --blue:#3987e5;
    --orange:#d95926;
    --aqua:#199e70;
    --yellow:#c98500;
    --good:#0ca30c;
    --warning:#fab219;
    --serious:#ec835a;
    --critical:#d03b3b;
    --mimic-bg:#e6eaef;
    --mimic-ink:#28313d;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
  }
  h1,h2,h3,.display{font-family:'Titillium Web',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono','Consolas',monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:12px 20px; padding-top:calc(12px + env(safe-area-inset-top,0px));
    background:linear-gradient(180deg,#0d131b 0%, #0b1017 100%);
    border-bottom:1px solid var(--line-strong);
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .brand{display:flex; flex-direction:column; margin-right:auto;}
  .brand b{font-size:15px; letter-spacing:.06em; text-transform:uppercase;}
  .brand span{font-size:11.5px; color:var(--ink-muted); letter-spacing:.04em;}
  .clock{font-size:13px; color:var(--ink-soft); text-align:right; line-height:1.3;}
  .clock b{color:var(--ink); display:block; font-size:16px;}

  .alarm-chip{
    display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    background:var(--panel-2); border:1px solid var(--line); font-size:12px; color:var(--ink-soft);
  }
  .alarm-chip .dot{width:8px;height:8px;border-radius:50%;}
  .alarm-chip b{color:var(--ink); font-family:'IBM Plex Mono',monospace;}

  .speed-ctrl{display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:6px 12px;}
  .speed-ctrl label{font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
  .speed-ctrl input[type=range]{width:110px; accent-color:var(--accent);}
  .speed-ctrl .val{font-family:'IBM Plex Mono',monospace; font-size:15px; min-width:66px; text-align:right;}

  .btn-run{
    font-family:'Titillium Web',sans-serif; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    font-size:13px; padding:10px 20px; border-radius:10px; border:1px solid var(--line-strong);
    cursor:pointer; transition:filter .15s ease;
  }
  .btn-run.run{background:var(--accent); color:#04262a; border-color:var(--accent);}
  .btn-run.stop{background:var(--critical); color:#2a0505; border-color:var(--critical);}
  .btn-run:hover{filter:brightness(1.08);}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px; margin:0 auto; padding:22px 20px 0;}

  /* ---------- navegação entre etapas ---------- */
  .stage-nav{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; margin:0 0 22px;}
  .nav-tab{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink-soft);
    font:inherit; text-align:left; cursor:pointer; min-width:0; transition:border-color .15s ease, background .15s ease;
  }
  .nav-tab:hover{border-color:var(--line-strong);}
  .nav-tab.active{background:var(--accent-dim); border-color:rgba(45,212,216,.5); color:var(--ink);}
  .nav-tab .n{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-muted);}
  .nav-tab.active .n{color:var(--accent);}
  .nav-tab .t{font-family:'Titillium Web',sans-serif; font-weight:700; font-size:14px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nav-tab .st{width:9px; height:9px; border-radius:50%; flex:none; background:var(--ink-muted);}
  .nav-tab .st.on{background:var(--accent);}
  .nav-tab .st.alarm{background:var(--critical); animation:pulseAlarm 1.4s infinite;}
  .nav-tab .cnt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; padding:1px 6px; border-radius:10px; background:rgba(208,59,59,.2); color:#ff9b9b;}
  .nav-tab .cnt:empty{display:none;}

  .stage{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .stage[hidden]{display:none;}

  .stage-pill{font-size:11px; font-weight:600; letter-spacing:.05em; padding:4px 10px; border-radius:20px; text-transform:uppercase; white-space:nowrap;}
  .stage-pill.on{background:var(--accent-dim); color:var(--accent); border:1px solid rgba(45,212,216,.4);}
  .stage-pill.off{background:rgba(255,255,255,.05); color:var(--ink-muted); border:1px solid var(--line);}
  .stage-pill.alarm{background:rgba(208,59,59,.16); color:#ff9b9b; border:1px solid rgba(208,59,59,.5); animation:pulseAlarm 1.4s infinite;}
  @keyframes pulseAlarm{0%,100%{opacity:1;}50%{opacity:.55;}}

  /* ---------- alarmes ---------- */
  .state-chip{font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:600; letter-spacing:.03em;}
  .state-chip.ATIVO{background:rgba(208,59,59,.15); color:#ff9b9b; border:1px solid rgba(208,59,59,.4);}
  .state-chip.RECONHECIDO{background:rgba(250,178,25,.15); color:var(--warning); border:1px solid rgba(250,178,25,.4);}
  .state-chip.NORMALIZADO{background:rgba(12,163,12,.15); color:#7bdd7b; border:1px solid rgba(12,163,12,.4);}
  .state-chip.EVENTO{background:rgba(45,212,216,.12); color:var(--accent); border:1px solid rgba(45,212,216,.35);}
  .ack-btn{font-family:'IBM Plex Sans',sans-serif; font-size:11px; padding:4px 10px; border-radius:6px; border:1px solid var(--line-strong); background:var(--panel-3); color:var(--ink); cursor:pointer;}
  .ack-btn:hover{filter:brightness(1.2);}

  /* ---------- tela IHM (etapa inteira sobre o diagrama, sem rolagem) ---------- */
  body.hmi-mode{height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column; padding-bottom:0;}
  body.hmi-mode .topbar{position:relative; top:0;}
  body.hmi-mode .wrap{flex:1; min-height:0; width:100%; max-width:none; display:flex; flex-direction:column; padding:12px 16px;}
  body.hmi-mode .stage-nav{margin-bottom:10px;}
  body.hmi-mode #stages{flex:1; min-height:0;}
  .stage.hmi:not([hidden]){display:grid; grid-template-columns:minmax(0,1fr) 300px; height:100%;}

  .hmi-canvas{position:relative; min-width:0; min-height:0; container-type:size; display:flex; align-items:center; justify-content:center; background:var(--mimic-bg);}
  .hmi-img{position:relative; container-type:inline-size;}
  .hmi-img > img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .hmi-leaders{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .hmi-leaders line{stroke:var(--mimic-ink); stroke-opacity:.55; stroke-width:1.2; stroke-dasharray:3 3; vector-effect:non-scaling-stroke;}
  .hmi-anchor{position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:var(--mimic-ink); box-shadow:0 0 0 2px rgba(255,255,255,.85);}

  .hmi-eq, .hmi-top{
    position:absolute; transform:translate(-50%,-50%); font-size:clamp(7.5px, 1.2cqw, 14px);
    background:rgba(11,15,20,.94); color:var(--ink); border:1.5px solid var(--line-strong); border-radius:.7em;
    box-shadow:0 .3em 1em rgba(0,0,0,.35);
  }
  .hmi-eq{width:15em; padding:.55em .7em .6em;}
  .hmi-eq-head{display:flex; align-items:center; gap:.55em; margin-bottom:.35em;}
  .hmi-eq-name{display:flex; flex-direction:column; min-width:0; line-height:1.15;}
  .hmi-eq-name b{font-family:'Titillium Web',sans-serif; font-size:1.1em; line-height:1.1;}
  .hmi-eq-name span{font-family:'IBM Plex Mono',monospace; font-size:.8em; color:var(--ink-muted);}
  .eq-pw{
    width:2.1em; height:2.1em; flex:none; border-radius:50%; padding:0; cursor:pointer; font:inherit; font-size:1em; line-height:1;
    background:#0b0f14; border:1.5px solid var(--critical); color:var(--critical); box-shadow:0 0 .6em rgba(208,59,59,.5);
  }
  .eq-pw.off{border-color:var(--good); color:var(--good); box-shadow:none;}
  .eq-pw:disabled{opacity:.45; cursor:not-allowed;}
  .hmi-eq-freq{display:flex; align-items:baseline; gap:.3em; padding:.3em 0 .25em; border-top:1px solid var(--line);}
  .hmi-eq-freq b{font-size:1.55em; font-weight:600;}
  .hmi-eq-freq small{color:var(--ink-muted);}
  .hmi-eq-freq .st{margin-left:auto; font-size:.8em; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .hmi-eq.state-on .st{color:var(--critical);}
  .hmi-eq.state-off, .hmi-eq.stopped{background:rgba(58,14,14,.95); border-color:rgba(208,59,59,.6);}
  .hmi-eq.state-off .hmi-eq-freq b{color:#ffb3b3;}
  .hmi-eq.state-off .st{color:var(--good);}
  .hmi-eq.state-transition .st{color:var(--warning);}
  .hmi-eq.has-alarm{border-color:var(--critical); box-shadow:0 0 0 .2em rgba(208,59,59,.35), 0 .3em 1em rgba(0,0,0,.35);}
  .hmi-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.6em; align-items:baseline; padding:.25em 0; border-top:1px solid var(--line); font-size:.92em; color:var(--ink-soft);}
  .hmi-row > span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hmi-row > b, .hmi-kv > b{color:var(--ink); font-weight:600; white-space:nowrap;}
  .hmi-row > b small, .hmi-kv > b small{color:var(--ink-muted); font-weight:400;}
  .st-warn > b{color:var(--warning) !important;}
  .st-alarm > b{color:#ff8a8a !important;}
  .idle > b::after{content:" ↓"; color:var(--warning);}

  .hmi-top{display:flex; align-items:center; gap:1.1em; padding:.5em .9em; white-space:nowrap;}
  .hmi-top-title{display:flex; align-items:baseline; gap:.45em;}
  .hmi-top-title span{color:var(--accent); font-size:.9em;}
  .hmi-top-title b{font-family:'Titillium Web',sans-serif; font-size:1.3em;}
  .hmi-top-title small{font-family:'IBM Plex Mono',monospace; color:var(--ink-muted); font-size:.8em;}
  .hmi-top .stage-pill{font-size:.8em;}
  .hmi-kv{display:flex; flex-direction:column; line-height:1.2; padding-left:1.1em; border-left:1px solid var(--line);}
  .hmi-kv > small{font-size:.75em; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
  .hmi-kv > b{font-size:1.15em;}
  .hmi-kv > span{font-size:.72em; color:var(--ink-muted); white-space:nowrap;}

  /* visão geral: caixa do topo em até duas linhas e caixas de resumo por etapa */
  .ov-top{flex-wrap:wrap; justify-content:center; row-gap:.5em; width:max-content; max-width:94cqw;}
  .ov-top > *{flex:none;}
  .ov-top .speed-ctrl{padding:.35em .8em; border-radius:.6em;}
  .ov-top .speed-ctrl label{font-size:.78em;}
  .ov-top .speed-ctrl input[type=range]{width:8em;}
  .ov-top .speed-ctrl .val{font-size:1.1em; min-width:5em;}
  .ov-eq{width:14.5em;}
  .ov-title{display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:1; padding:0; border:none; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; line-height:1.15;}
  .ov-title b{font-family:'Titillium Web',sans-serif; font-size:1.1em;}
  .ov-title:hover b{color:var(--accent); text-decoration:underline;}
  .ov-st{font-size:.78em; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted);}
  .ov-st.on{color:var(--accent);}
  .ov-st.alarm{color:#ff9b9b; animation:pulseAlarm 1.4s infinite;}
  .ov-eq .hmi-row{padding:.18em 0;}
  .ov-leaders line{stroke:#fff; stroke-opacity:.85;}
  #stage-geral .hmi-canvas{background:var(--bg);}

  .hmi-side{display:flex; flex-direction:column; min-height:0; border-left:1px solid var(--line); background:var(--panel);}
  .hmi-side-head{display:flex; flex-direction:column; gap:2px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .hmi-side-head b{font-family:'Titillium Web',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:.06em;}
  .hmi-side-head span{font-size:11.5px; color:var(--ink-muted);}
  .hmi-alarms{flex:1; min-height:0; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px;}
  .hal{background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--sev); border-radius:8px; padding:8px 10px; font-size:12px;}
  .hal-top{display:flex; align-items:center; gap:8px; margin-bottom:4px; color:var(--ink-muted); font-size:11px;}
  .hal-top .hal-tag{color:var(--ink);}
  .hal-top .state-chip{margin-left:auto;}
  .hal-msg{color:var(--ink-soft); line-height:1.35;}
  .hal .ack-btn{margin-top:6px;}
  .hal-empty{color:var(--ink-muted); text-align:center; padding:24px 8px; font-size:12px;}

  .rotate-hint{display:none;}
  @media (orientation:portrait) and (max-width:820px){
    body.hmi-mode .rotate-hint{
      display:flex; position:fixed; inset:0; z-index:100; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      padding:24px; text-align:center; background:var(--bg); color:var(--ink-soft); font-size:14px;
    }
    body.hmi-mode .rotate-hint b{font-family:'Titillium Web',sans-serif; font-size:20px; color:var(--ink);}
  }
  @media (max-width:1000px){
    .stage.hmi:not([hidden]){grid-template-columns:minmax(0,1fr) 230px;}
  }
  @media (max-height:520px){
    body.hmi-mode .topbar{padding:6px 12px;}
    body.hmi-mode .wrap{padding:6px 10px;}
    body.hmi-mode .stage-nav{margin-bottom:6px;}
    body.hmi-mode .nav-tab{padding:5px 10px;}
  }

  @media (max-width:640px){
    .topbar{padding:10px 14px;}
    .brand b{font-size:13px;}
    .clock{display:none;}
    .speed-ctrl input[type=range]{width:80px;}
    .stage-nav{grid-template-columns:repeat(6,auto); overflow-x:auto;}
    .nav-tab .t{display:none;}
  }
</style>
</head>
<body class="hmi-mode">

<header class="topbar">
  <div class="brand">
    <b>Supervisório · Beneficiamento Têxtil</b>
    <span>Linha contínua de preparação — simulação</span>
  </div>
  <div class="alarm-chip"><span class="dot" style="background:var(--warning)"></span>Alertas <b id="cnt-warn">0</b></div>
  <div class="alarm-chip"><span class="dot" style="background:var(--critical)"></span>Críticos <b id="cnt-crit">0</b></div>
  <button class="btn-run run" id="btnRun">Rodando</button>
  <button class="btn-run" id="btnLogout" style="background:var(--panel-3); color:var(--ink-soft); border-color:var(--line-strong);">Sair</button>
  <div class="clock">
    <b id="clockTime">00:00:00</b>
    <span id="clockDate">--</span>
  </div>
</header>

<div class="wrap">
  <nav class="stage-nav" id="stageNav" aria-label="Etapas do processo"></nav>
  <div id="stages"></div>
</div>

<div class="rotate-hint" role="alert">
  <b>Gire o aparelho</b>
  <span>O supervisório foi feito para ser visto na horizontal.</span>
</div>

<script>
if(sessionStorage.getItem('vr_supervisorio_auth') !== 'ok'){
  window.location.href = 'login.html';
}

// Tela de cada etapa (IHM), em % da moldura da imagem:
//   hmi.top   = centro da caixa de informações gerais da etapa
//   hmi.frame = proporção da moldura, quando precisa ser mais alta que a imagem (a imagem fica centralizada)
//   anchor    = ponto do equipamento na imagem; box = centro da caixa do equipamento
//   show      = instrumentos exibidos na caixa do equipamento (os demais vão para a caixa do topo)
const STAGES = [
  { id:'cham', slug:'chamuscagem', num:'01', name:'Chamuscagem',
    desc:'Queima das fibrilas soltas na superfície do tecido com chama de gás, deixando-o liso e uniforme antes dos tratamentos úmidos. A velocidade da linha e a distância bico–tecido definem a intensidade da queima.', code:'CHAM-100', img:'70e28777-1981-43d1-8a1e-fa4d0538a72e.png', ratio:'612/408',
    hmi:{ top:{x:50, y:7} },

        anchor:{x:29, y:41}, box:{x:25, y:23}, show:['TT-102','PT-103','ZT-104']},
      {id:'M-103', station:'Resfriamento', label:'Motor dos cilindros de resfriamento', nominalHz:45, drives:['FT-105'],
        totalizer:{tagId:'FT-105', label:'Volume acumulado'},
        anchor:{x:34, y:55}, box:{x:36, y:79}, show:['FT-105']},
      {id:'M-104', station:'Condução', label:'Motor de acionamento principal', nominalHz:50, drives:['SIC-101'],
        anchor:{x:67, y:50}, box:{x:66, y:25}},
      {id:'M-105', station:'Caixa de saída', label:'Motor do enrolador de saída', nominalHz:45, master:true,
        anchor:{x:91, y:54}, box:{x:89, y:77}},
    ],
    tags:[
      {id:'SIC-101', label:'Velocidade da linha', short:'Velocidade', unit:'m/min', sp:30, lo:20, hi:40, aLo:10, aHi:45, dec:1, linkSpeed:true, idle:0},
      {id:'TT-102', label:'Temperatura da chama', short:'Temp. da chama', unit:'°C', sp:900, lo:850, hi:950, aLo:800, aHi:1000, dec:0, idle:25},
      {id:'PT-103', label:'Pressão do gás', unit:'mbar', sp:21, lo:18, hi:24, aLo:15, aHi:28, dec:1, idle:0},

        anchor:{x:73, y:54}, box:{x:72, y:74}},
      {id:'M-205', station:'Secagem', label:'Motor dos cilindros de secagem', nominalHz:45,
        anchor:{x:91, y:44}, box:{x:89, y:25}},
    ],
    tags:[
      {id:'TT-201', label:'Temperatura do banho', short:'Temp. do banho', unit:'°C', sp:70, lo:60, hi:75, aLo:55, aHi:80, dec:0, idle:25},

function initTag(t){

  return t;
}

function initMotor(m){
  m.on = true;
  m.freq = m.nominalHz;
  if(m.totalizer) m.volumeL = 0;
  return m;
}

function fmt(v,dec){ return v.toFixed(dec); }

// Volume em litros até 1 m³; acima disso em m³.
function fmtVolume(litros){
  return litros < 1000
    ? Math.round(litros).toLocaleString('pt-BR')+' L'
    : (litros/1000).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2})+' m³';
}

function sevColor(sev){
  return sev==='critical' ? 'var(--critical)' : sev==='serious' ? 'var(--serious)' : sev==='evento' ? 'var(--accent)' : 'var(--warning)';
}

// Liga/desliga uma etapa inteira pela visão geral.
function toggleStagePower(id){
  if(!running) return;
  const stage = STAGES.find(s => s.id === id);
  stage._stopped = !stage._stopped;
  if(stage._stopped){
    stage.motors.forEach(m => { if(m.on){ m.on = false; m._stageTripped = true; } });
  } else {
    stage.motors.forEach(m => { if(m._stageTripped){ m.on = true; m._stageTripped = false; } });
  }
  alarms.unshift({id:alarmSeq++, t:Date.now(), stageId:stage.id, stageName:stage.name, tagId:stage.code,
    message: stage._stopped ? 'Etapa desligada pelo operador' : 'Etapa religada pelo operador',
    severity:'evento', state:'EVENTO'});
  if(alarms.length>200) alarms.pop();
  renderHmi(stage);
  renderOverview();
  renderAlarms();
}
window.toggleStagePower = toggleStagePower;

function renderOverview(){
  let stagesOn = 0, motorsOn = 0, motorsTotal = 0;
  STAGES.forEach(s => {
    const st = stageStatus(s);
    motorsOn += s.motors.filter(m => m.freq >= 0.5).length;
    motorsTotal += s.motors.length;
    if(st.cls !== 'off') stagesOn++;

    const box = document.getElementById('ovbox-'+s.id);
    box.classList.toggle('stopped', !!s._stopped);
    box.classList.toggle('has-alarm', st.cls === 'alarm');
    const stEl = document.getElementById('ovst-'+s.id);
    stEl.textContent = st.text;
    stEl.className = 'ov-st '+st.cls;
    const pw = document.getElementById('ovpw-'+s.id);
    pw.classList.toggle('off', !!s._stopped);
    pw.disabled = !running;

    s.tags.forEach(t => renderTagValue(`ovrow-${s.id}-${t.id}`, `ovpv-${s.id}-${t.id}`, t));
    s.motors.forEach((m,i) => {
      if(m.totalizer) document.getElementById(`ovvol-${s.id}-${i}`).textContent = fmtVolume(m.volumeL);
    });
  });

  document.getElementById('ovSumStages').innerHTML = `${stagesOn} <small>/ ${STAGES.length}</small>`;
  document.getElementById('ovSumMotors').innerHTML = `${motorsOn} <small>/ ${motorsTotal}</small>`;

  const pill = document.getElementById('pill-geral');
  pill.classList.remove('on','off','alarm');
  const anyAlarm = STAGES.some(s => s.tags.some(t => t._alarmOpen));
  if(!running || stagesOn === 0){ pill.textContent = 'Parado'; pill.classList.add('off'); }
  else if(anyAlarm){ pill.textContent = 'Alarme'; pill.classList.add('alarm'); }
  else { pill.textContent = stagesOn < STAGES.length ? 'Parcial' : 'Rodando'; pill.classList.add('on'); }
}

// Tela IHM: diagrama ocupando a tela, uma caixa por equipamento, caixa geral no topo
// e alarmes/eventos na faixa lateral. A página não rola.
function buildHmiStage(stage){
  const el = document.createElement('section');
  el.className = 'stage hmi';
  el.id = 'stage-'+stage.id;
  el.hidden = true;

  const frame = stage.hmi.frame || stage.ratio;
  const shown = new Set(stage.motors.flatMap(m => m.show || []));
  const generalTags = stage.tags.filter(t => !shown.has(t.id));
  const tagById = id => stage.tags.find(t => t.id === id);
  const valueHtml = t => `<b class="mono"><span id="hpv-${stage.id}-${t.id}">–</span> <small>${t.unit}</small></b>`;

  const leaders = stage.motors.map(m =>
    `<line x1="${m.anchor.x}" y1="${m.anchor.y}" x2="${m.box.x}" y2="${m.box.y}"/>`).join('');
  const anchors = stage.motors.map(m =>
    `<i class="hmi-anchor" style="left:${m.anchor.x}%;top:${m.anchor.y}%"></i>`).join('');

  const boxes = stage.motors.map((m,i) => `
    <div class="hmi-eq" id="heq-${stage.id}-${i}" style="left:${m.box.x}%;top:${m.box.y}%">
      <div class="hmi-eq-head">
        <button class="eq-pw" id="hpw-${stage.id}-${i}" onclick="toggleMotor('${stage.id}',${i})"
          title="Ligar/desligar ${m.id} — ${m.label}" aria-label="Ligar/desligar ${m.id} — ${m.station}">⏻</button>
        <div class="hmi-eq-name"><b title="${m.station}">${m.station}</b><span>${m.id}</span></div>
      </div>
      <div class="hmi-eq-freq"><b class="mono" id="hfreq-${stage.id}-${i}">–</b><small>Hz</small><span class="st" id="hst-${stage.id}-${i}">–</span></div>
      ${(m.show||[]).map(id => { const t = tagById(id); return `
      <div class="hmi-row" id="hrow-${stage.id}-${t.id}" title="${t.id} — ${t.label}"><span>${t.short || t.label}</span>${valueHtml(t)}</div>`; }).join('')}
      ${m.totalizer ? `
      <div class="hmi-row"><span>${m.totalizer.label}</span><b class="mono" id="hvol-${stage.id}-${i}">0 L</b></div>` : ''}
    </div>`).join('');

  const top = `
    <div class="hmi-top" style="left:${stage.hmi.top.x}%;top:${stage.hmi.top.y}%">
      <div class="hmi-top-title"><span class="mono">${stage.num}</span><b>${stage.name}</b><small>${stage.code}</small></div>
      <span class="stage-pill on" id="hpill-${stage.id}">Rodando</span>
      ${generalTags.some(t => t.linkSpeed) ? '' : `
      <div class="hmi-kv" title="Velocidade da linha"><small>Velocidade</small><b class="mono"><span id="hspd-${stage.id}">–</span> <small>m/min</small></b></div>`}
      ${generalTags.map(t => `
      <div class="hmi-kv" id="hrow-${stage.id}-${t.id}" title="${t.id} — ${t.label}"><small>${t.short || t.label}</small>${valueHtml(t)}</div>`).join('')}
      <div class="hmi-kv"><small>Motores</small><b class="mono" id="hmot-${stage.id}">–</b></div>
      <div class="hmi-kv"><small>Intertravamento</small><b id="hilk-${stage.id}">–</b></div>
      <div class="hmi-kv"><small>Alarmes</small><b class="mono" id="halm-${stage.id}">0</b></div>
    </div>`;

  el.innerHTML = `
    <div class="hmi-canvas">
      <div class="hmi-img" style="aspect-ratio:${frame}; width:min(100cqw, calc(100cqh * ${frame}))">
        <img src="${stage.img}" alt="Diagrama esquemático — ${stage.name}">
        <svg class="hmi-leaders" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${leaders}</svg>
        ${anchors}
        ${top}
        ${boxes}
      </div>
    </div>
    <aside class="hmi-side" aria-label="Alarmes e eventos — ${stage.name}">
      <div class="hmi-side-head"><b>Alarmes &amp; eventos</b><span id="halmSub-${stage.id}">sem pendências</span></div>
      <div class="hmi-alarms" id="hlist-${stage.id}"></div>
    </aside>`;
  return el;
}

function buildStages(){
  const root = document.getElementById('stages');
  STAGES.forEach(stage => root.appendChild(buildHmiStage(stage)));

// Cada etapa é uma página própria, endereçada por #slug (ex.: supervisorio.html#purga).
// Sem #slug (logo após o login) abre a visão geral.
const OVERVIEW_PAGE = {id:'geral', slug:'geral', name:'Visão geral'};

function showStage(id, fromHash){
  const page = id === 'geral' ? OVERVIEW_PAGE : (STAGES.find(s => s.id === id) || OVERVIEW_PAGE);
  currentStageId = page.id;
  [OVERVIEW_PAGE, ...STAGES].forEach(s => {
    document.getElementById('stage-'+s.id).hidden = s.id !== page.id;
    document.getElementById('nav-'+s.id).classList.toggle('active', s.id === page.id);
  });
  document.title = `${page.name} — Supervisório Têxtil`;
  if(!fromHash && location.hash !== '#'+page.slug) history.pushState(null, '', '#'+page.slug);
  window.scrollTo(0, 0);
}

function stageFromHash(){
  const slug = location.hash.replace('#','');
  return (STAGES.find(s => s.slug === slug) || OVERVIEW_PAGE).id;
}
window.addEventListener('popstate', () => showStage(stageFromHash(), true));
window.addEventListener('hashchange', () => showStage(stageFromHash(), true));

function pushAlarm(stage, tag, severity){
  alarms.unshift({id:alarmSeq++, t:Date.now(), stageId:stage.id, stageName:stage.name, tagId:tag.id,
    message:`${tag.label} fora da faixa de operação`, severity, state:'ATIVO'});
  if(alarms.length>200) alarms.pop();
}

function normalizeAlarm(stage, tag){
  const open = alarms.find(a => a.stageId===stage.id && a.tagId===tag.id && a.state!=='NORMALIZADO');
  if(open) open.state='NORMALIZADO';
}

function ackAlarm(id){
  const a = alarms.find(a=>a.id===id);
  if(a && a.state==='ATIVO') a.state='RECONHECIDO';
  renderAlarms();
}
window.ackAlarm = ackAlarm;
window.showStage = showStage;

// Intertravamento: desenroladores/enroladores (master:true) comandam a etapa inteira.
function isInterlocked(stage){
  return stage.motors.some(m => m.master && !m.on);
}

function toggleMotor(stageId, idx){
  if(!running) return;
  const stage = STAGES.find(s => s.id === stageId);
  const motor = stage.motors[idx];
  if(stage._stopped) return;
  if(!motor.master && isInterlocked(stage)) return;
  motor.on = !motor.on;

  if(motor.master && !motor.on){
    // Desligou um desenrolador/enrolador: desarma todos os outros motores da etapa.
    stage.motors.forEach(m => {
      if(m !== motor && m.on){ m.on = false; m._tripped = true; }
    });
    alarms.unshift({id:alarmSeq++, t:Date.now(), stageId:stage.id, stageName:stage.name, tagId:motor.id,
      message:`Intertravamento: ${motor.station.toLowerCase()} desligado — etapa parada`, severity:'serious',
      state:'ATIVO', interlock:true});
    if(alarms.length>200) alarms.pop();
  } else if(motor.master && motor.on){
    // Religou: os motores desarmados pelo intertravamento voltam a partir.
    motor._tripped = false;
    stage.motors.forEach(m => { if(m._tripped){ m.on = true; m._tripped = false; } });
    const open = alarms.find(a => a.interlock && a.stageId===stage.id && a.state!=='NORMALIZADO');
    if(open) open.state = 'NORMALIZADO';
  }
  renderHmi(stage);
  renderAlarms();
}
window.toggleMotor = toggleMotor;

function stepMotor(motor){
  const target = (running && motor.on) ? motor.nominalHz + (Math.random()-0.5)*0.6 : 0;
  motor.freq += (target - motor.freq) * 0.3;
  if(motor.freq < 0.05) motor.freq = 0;
}

function motorState(m){
  if(running && m.on){
    return m.freq >= m.nominalHz*0.85 ? {state:'Ligado', cls:'state-on'} : {state:'Partida', cls:'state-transition'};
  }
  if(m.freq > 0.5) return {state:'Parando', cls:'state-transition'};
  if(m._tripped) return {state:'Intertravado', cls:'state-off'};
  return {state:'Desligado', cls:'state-off'};
}

function motorLocked(stage, m){
  return !running || stage._stopped || (isInterlocked(stage) && !m.master);
}

function stageStatus(stage){
  if(stage._stopped) return {text:'Desligada', cls:'off'};
  if(!running || stage.motors.every(m => m.freq < 0.5)) return {text:'Parado', cls:'off'};
  if(stage.tags.some(t => t._alarmOpen)) return {text:'Alarme', cls:'alarm'};
  return {text:'Rodando', cls:'on'};
}

function interlockStatus(stage){
  if(stage._stopped) return {text:'Etapa desligada', color:'#ff9b9b'};
  if(!stage.motors.some(m => m.master)) return {text:'—', color:'var(--ink-muted)'};
  if(isInterlocked(stage)) return {text:'Atuado · etapa parada', color:'#ff9b9b'};
  return {text:'Normal', color:'var(--ink)'};
}

function stepTag(tag){
  const range = tag.hi - tag.lo;
  const idleActive = tag._idleActive && tag.idle !== undefined;
  if(idleActive){
    const noise = (Math.random()-0.5) * range * 0.04;
    tag.pv += noise + (tag.idle - tag.pv) * 0.12;
  } else if(!running){
    tag.pv += (tag.sp - tag.pv) * 0.08;
  } else {
    // Operação normal: oscilação em torno do SP, sempre dentro da faixa lo–hi.
    // halfBand = menor distância do SP até um dos limites (ou 10% da faixa se o SP estiver fora dela).
    const halfBand = Math.max(Math.min(tag.sp - tag.lo, tag.hi - tag.sp), range*0.1);
    const limit = halfBand * 0.8;
    let dev = tag.pv - tag.sp;
    if(Math.abs(dev) > limit){
      // Voltando de uma condição anormal (motor religado): retorna ao SP sem saltos.
      dev *= 0.85;
    } else {
      dev = dev*0.85 + (Math.random()-0.5) * halfBand * 0.24;
      dev = Math.max(-limit, Math.min(limit, dev));
    }
    tag.pv = tag.sp + dev;
  }
  let hardLo = tag.aLo - range*0.35, hardHi = tag.aHi + range*0.35;
  if(idleActive){
    hardLo = Math.min(hardLo, tag.idle - range*0.15);
    hardHi = Math.max(hardHi, tag.idle + range*0.15);
  }
  tag.pv = Math.min(hardHi, Math.max(hardLo, tag.pv));
}

function applyMotorCoupling(stage){
  stage.tags.forEach(t => { t._idleActive = false; });
  stage.motors.forEach(m => {
    if(!m.drives) return;
    const stopped = !(running && m.on);
    if(!stopped) return;
    m.drives.forEach(tagId => {
      const t = stage.tags.find(tg => tg.id === tagId);
      if(t) t._idleActive = true;
    });
  });
}

function evalAlarm(stage, tag){
  const range = tag.hi - tag.lo;
  const bandOut = tag.pv < tag.aLo || tag.pv > tag.aHi;
  const deepOut = tag.pv < tag.aLo - range*0.2 || tag.pv > tag.aHi + range*0.2;
  if(bandOut && !tag._alarmOpen){
    tag._alarmOpen = true;
    pushAlarm(stage, tag, deepOut ? 'critical' : 'serious');
  } else if(!bandOut && tag._alarmOpen){
    tag._alarmOpen = false;
    normalizeAlarm(stage, tag);
  }
}

function tagState(tag){
  if(tag.pv < tag.aLo || tag.pv > tag.aHi) return 'alarm';
  if(tag.pv < tag.lo || tag.pv > tag.hi) return 'warn';
  return 'ok';
}

function renderStatusPill(stage, pillId){
  const st = stageStatus(stage);
  const pill = document.getElementById(pillId);
  pill.classList.remove('on','off','alarm');
  pill.classList.add(st.cls);
  pill.textContent = st.text;
  const navSt = document.getElementById('navst-'+stage.id);
  navSt.classList.remove('on','alarm');
  if(st.cls !== 'off') navSt.classList.add(st.cls);
}

// ---------- tela IHM: tudo sobre o diagrama ----------
function renderHmi(stage){
  stage.motors.forEach((m,i) => {
    const {state, cls} = motorState(m);
    const box = document.getElementById(`heq-${stage.id}-${i}`);
    box.classList.remove('state-on','state-off','state-transition');
    box.classList.add(cls);
    box.classList.toggle('has-alarm', (m.show||[]).some(id => stage.tags.find(t => t.id === id)._alarmOpen));
    document.getElementById(`hfreq-${stage.id}-${i}`).textContent = m.freq.toFixed(1);
    document.getElementById(`hst-${stage.id}-${i}`).textContent = state;
    const pw = document.getElementById(`hpw-${stage.id}-${i}`);
    pw.classList.toggle('off', !(m.on && m.freq > 0.5));
    pw.disabled = motorLocked(stage, m);
    if(m.totalizer) document.getElementById(`hvol-${stage.id}-${i}`).textContent = fmtVolume(m.volumeL);
  });

  stage.tags.forEach(t => renderTagValue(`hrow-${stage.id}-${t.id}`, `hpv-${stage.id}-${t.id}`, t));

  renderStatusPill(stage, 'hpill-'+stage.id);
  // Etapas sem instrumento de velocidade mostram a velocidade da linha (zero se a etapa não está puxando tecido).
  const spd = document.getElementById('hspd-'+stage.id);
  if(spd){
    const moving = running && !stage._stopped && !isInterlocked(stage) && stage.motors.some(m => m.freq >= 0.5);
    spd.textContent = fmt(moving ? globalSpeed : 0, 1);
  }
  const motorsOn = stage.motors.filter(m => m.freq >= 0.5).length;
  document.getElementById('hmot-'+stage.id).textContent = `${motorsOn}/${stage.motors.length}`;
  const ilk = document.getElementById('hilk-'+stage.id);
  const ilkSt = interlockStatus(stage);
  ilk.textContent = ilkSt.text;
  ilk.style.color = ilkSt.color;
}

// Valor de um instrumento numa caixa (etapa ou visão geral), com a cor do estado.
function renderTagValue(rowId, pvId, t){
  const row = document.getElementById(rowId);
  if(!row) return;
  document.getElementById(pvId).textContent = fmt(t.pv, t.dec);
  row.classList.remove('st-ok','st-warn','st-alarm');
  row.classList.add('st-'+tagState(t));
  row.classList.toggle('idle', !!t._idleActive);
}

// Faixa lateral de alarmes; na visão geral (withStage) cada alarme mostra a etapa de origem.
// Retorna quantos alarmes estão pendentes.
function renderAlarmPanel(pageId, list, withStage){
  const pending = list.filter(a => a.state !== 'NORMALIZADO' && a.state !== 'EVENTO');
  const unacked = pending.filter(a => a.state === 'ATIVO').length;
  document.getElementById('halmSub-'+pageId).textContent =
    pending.length ? `${pending.length} pendente(s) · ${unacked} sem reconhecimento` : 'sem pendências';
  const box = document.getElementById('hlist-'+pageId);
  if(list.length === 0){
    box.innerHTML = '<div class="hal-empty">Nenhum evento registrado</div>';
    return 0;
  }
  box.innerHTML = list.slice(0,30).map(a => `
    <div class="hal" style="--sev:${sevColor(a.severity)}">
      <div class="hal-top">
        <span class="mono">${fmtTime(a.t)}</span><span class="mono hal-tag">${a.tagId}</span>
        <span class="state-chip ${a.state}">${a.state}</span>
      </div>
      <div class="hal-msg">${withStage ? `<b>${a.stageName}</b> · ` : ''}${a.message}</div>
      ${a.state==='ATIVO' ? `<button class="ack-btn" onclick="ackAlarm(${a.id})">Reconhecer</button>` : ''}
    </div>`).join('');
  return pending.length;
}

function renderAlarms(){
  const openCount = {warning:0, serious:0, critical:0};
  STAGES.forEach(s => s.tags.forEach(t => {
    if(t._alarmOpen){
      const range = t.hi - t.lo;
      const deep = t.pv < t.aLo - range*0.2 || t.pv > t.aHi + range*0.2;
      openCount[deep?'critical':'serious']++;
    }
  }));
  document.getElementById('cnt-warn').textContent = openCount.serious;
  document.getElementById('cnt-crit').textContent = openCount.critical;

  STAGES.forEach(stage => {
    const pending = renderAlarmPanel(stage.id, alarms.filter(a => a.stageId === stage.id), false);
    document.getElementById('navcnt-'+stage.id).textContent = pending || '';
    document.getElementById('halm-'+stage.id).textContent = pending;
  });
  renderAlarmPanel('geral', alarms, true);
}

function fmtTime(t){
  const d = new Date(t);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

function updateClock(){
  const d = new Date();
  document.getElementById('clockTime').textContent = d.toLocaleTimeString('pt-BR');
  document.getElementById('clockDate').textContent = d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'});
}

function tick(){
  STAGES.forEach(stage => {
    stage.tags.forEach(t => { if(t.linkSpeed) t.sp = globalSpeed; });
    applyMotorCoupling(stage);
    stage.tags.forEach(t => {
      stepTag(t);
      // Etapa desligada pelo operador: alarmes de processo ficam inibidos.
      if(stage._stopped){
        if(t._alarmOpen){ t._alarmOpen = false; normalizeAlarm(stage, t); }
      } else {
        evalAlarm(stage, t);
      }
    });
    stage.motors.forEach(stepMotor);
    // Totalizador: acumula o volume da vazão associada enquanto o motor está girando.
    stage.motors.forEach(m => {
      if(!m.totalizer || m.freq < 0.5) return;
      const t = stage.tags.find(tg => tg.id === m.totalizer.tagId);
      if(t) m.volumeL += Math.max(0, t.pv) * 1000 * (TICK_S/3600);
    });
    renderHmi(stage);
  });
  renderAlarms();
  renderOverview();

  const dt = TICK_S;
  // Consumo proporcional às etapas ligadas; a linha é contínua, então só produz com todas ligadas.
  const activeFrac = STAGES.filter(s => !s._stopped).length / STAGES.length;
  if(running && activeFrac > 0){
    if(activeFrac === 1) totals.meters += globalSpeed * (dt/60);
    const waterRate = (8 + (globalSpeed/45)*7) * activeFrac;
    const steamRate = (280 + (globalSpeed/45)*340) * activeFrac;
    const powerKw = (140 + (globalSpeed/45)*110) * activeFrac;
    totals.water += waterRate*(dt/3600);
    totals.steam += steamRate*(dt/3600);
    totals.energyKwh += powerKw*(dt/3600);
    document.getElementById('stWater').innerHTML = waterRate.toFixed(1)+' <small>m³/h</small>';
    document.getElementById('stSteam').innerHTML = Math.round(steamRate)+' <small>kg/h</small>';
    document.getElementById('stPower').innerHTML = Math.round(powerKw)+' <small>kW</small>';
    const anyAlarm = STAGES.some(s=>s.tags.some(t=>t._alarmOpen));
    const eff = activeFrac < 1 ? 0 : (anyAlarm ? 88+Math.random()*4 : 94+Math.random()*4);
    document.getElementById('stEff').innerHTML = eff.toFixed(1)+' <small>%</small>';
  } else {
    document.getElementById('stWater').innerHTML = '0.0 <small>m³/h</small>';
    document.getElementById('stSteam').innerHTML = '0 <small>kg/h</small>';
    document.getElementById('stPower').innerHTML = '0 <small>kW</small>';
    document.getElementById('stEff').innerHTML = '0.0 <small>%</small>';
  }
  document.getElementById('stTotal').innerHTML = Math.round(totals.meters).toLocaleString('pt-BR')+' <small>m</small>';
  document.getElementById('stWaterTot').textContent = totals.water.toFixed(1)+' m³ no total';
  document.getElementById('stSteamTot').textContent = Math.round(totals.steam).toLocaleString('pt-BR')+' kg no total';
  document.getElementById('stPowerTot').textContent = Math.round(totals.energyKwh).toLocaleString('pt-BR')+' kWh no total';
}

document.getElementById('btnRun').addEventListener('click', function(){
  running = !running;
  this.textContent = running ? 'Rodando' : 'Parado';
  this.classList.toggle('run', running);
  this.classList.toggle('stop', !running);
});

document.getElementById('btnLogout').addEventListener('click', function(){
  sessionStorage.removeItem('vr_supervisorio_auth');
  sessionStorage.removeItem('vr_supervisorio_user');
  window.location.href = 'login.html';
});

buildNav();
buildOverview();
buildStages();

// O controle de velocidade só existe na visão geral (criado em buildOverview).
document.getElementById('speedRange').addEventListener('input', function(){
  globalSpeed = Number(this.value);
  document.getElementById('speedVal').textContent = globalSpeed;
});
showStage(stageFromHash(), true);
renderAlarms();
updateClock();
setInterval(updateClock, 1000);
setInterval(tick, TICK_S*1000);
tick();
</script>
</body>
